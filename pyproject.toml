[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hagfish-adaptive-trainer"
version = "0.3.0"
description = "Adaptive training budget optimizer (bio-inspired Hagfish agent)"
readme = "README.md"
requires-python = ">=3.8"

authors = [
  { name = "Sarvesh PV", email = "pvsarvesh29@gmail.com" },
]
license = { text = "MIT" }
keywords = ["adaptive", "training", "bandit", "optimizer", "machine-learning", "resource-allocation"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.8",
  "Development Status :: 4 - Beta",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  "numpy>=1.24,<2.0"
]

[tool.setuptools]
packages = ["adaptive_trainer"]

[project.urls]
Repository = "https://github.com/Sarrvessh/Hagfish_Agent_System"
Issues = "https://github.com/Sarrvessh/Hagfish_Agent_System/issues"
Documentation = "https://github.com/Sarrvessh/Hagfish_Agent_System#readme"
